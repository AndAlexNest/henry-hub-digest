name: Henry Hub Digest

on:
  schedule:
    - cron: '30 3,9,15 * * 1-5'
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run digest script
        env:
          YANDEXGPT_API_KEY: ${{ secrets.YANDEXGPT_API_KEY }}
          YANDEXGPT_FOLDER_ID: ${{ secrets.YANDEXGPT_FOLDER_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: python main.py
